name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: brew install xcodegen ldid

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild -project GestaltManager.xcodeproj \
            -scheme GestaltManager \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Assinar com entitlements e empacotar .tipa
        run: |
          APP=build/Build/Products/Release-iphoneos/GestaltManager.app
          ldid -SEntitlements.plist "$APP/GestaltManager"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry GestaltManager.tipa Payload

      - name: Publicar release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest GestaltManager.tipa --title "Gestalt Manager (fase 0)" --notes "Build automatico. Abra o .tipa no TrollStore."
